<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlexiFunnels Test Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #141A33; --ring: #27315E; --ring-2: #3A4A86;
    --glass: rgba(255,255,255,.065); --glass-2: rgba(255,255,255,.11); --edge: rgba(255,255,255,.13);
    --text: #EEF1FA; --muted: #A5AECB; --faint: #7580A6;
    --pass: #3DDC97; --pass-dim: rgba(61,220,151,.14);
    --fail: #FF6B6B; --fail-dim: rgba(255,107,107,.14);
    --run: #FFC247; --run-dim: rgba(255,194,71,.14);
    --sky: #7CC4FF;
    --sans: "Sora", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", Consolas, monospace;
    --r-lg: 18px; --r-md: 12px; --r-sm: 8px;
    --tab-sel: #7CC4FF; --tab-sel-text: #0E1631; --panel-strong: rgba(28,35,68,.92);
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  [data-theme="day"] {
    --night: #EAF0FA; --ring: #C9D5EE; --ring-2: #AFC0E4;
    --glass: rgba(255,255,255,.72); --glass-2: rgba(255,255,255,.95); --edge: rgba(22,32,63,.12);
    --text: #16203F; --muted: #51608A; --faint: #7D89AD;
    --pass: #0E9F6A; --pass-dim: rgba(14,159,106,.12);
    --fail: #D64545; --fail-dim: rgba(214,69,69,.10);
    --run: #B7791F; --run-dim: rgba(183,121,31,.12);
    --sky: #2C6FD6; --tab-sel: #2C6FD6; --tab-sel-text: #FFFFFF; --panel-strong: rgba(255,255,255,.97);
  }
  body { transition: background-color .4s var(--ease), color .4s var(--ease); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: transparent;
         color: var(--text); font: 14.5px/1.55 var(--sans); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
  a { color: var(--sky); }
  .glass { background: var(--glass); border: 1px solid var(--edge); border-radius: var(--r-lg);
           backdrop-filter: blur(14px) saturate(120%); -webkit-backdrop-filter: blur(14px) saturate(120%); }

  /* ===================== app shell: sidebar + views ===================== */
  .shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; border-radius: 0 22px 22px 0; border-left: 0; display: flex; flex-direction: column; padding: 18px 14px; gap: 6px; z-index: 35; }
  .side .brand { padding: 4px 8px 16px; }
  .side .brand { display: flex; align-items: center; gap: 10px; }
  .side .brand .logo { flex: none; width: 40px; height: 40px; }
  .side .brand h1 { font-size: 16px; white-space: normal; line-height: 1.2; } .side .brand h1 .t2 { display: block; }
  .top .hbtn.icon { font-size: 0; width: 36px; height: 36px; padding: 0; display: inline-grid; place-items: center; }
  .top .hbtn.icon::before { content: attr(data-ic); font-size: 16px; line-height: 1; }
  .top .right { gap: 6px; }
  .top .right .chip { max-width: 240px; overflow: hidden; } .top .right .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .navitem { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid transparent; background: transparent; cursor: pointer; font-size: 14px; color: var(--muted); text-align: left; transition: background .2s, color .2s, border-color .2s, transform .15s; }
  .navitem svg { width: 19px; height: 19px; flex: none; }
  .navitem:hover { background: var(--glass-2); color: var(--text); border-color: var(--edge); }
  .navitem:active { transform: scale(.98); }
  .navitem[aria-current="page"] { background: var(--tab-sel); color: var(--tab-sel-text); font-weight: 600; border-color: var(--tab-sel); box-shadow: 0 6px 20px rgba(124,196,255,.25); }
  .navitem { white-space: nowrap; } .navitem .lbl { overflow: hidden; text-overflow: ellipsis; }
  .navitem .count { margin-left: auto; flex: none; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--run-dim); color: var(--run); font-weight: 600; }
  .side-foot { margin-top: auto; padding: 14px 10px 4px; border-top: 1px solid var(--edge); display: flex; gap: 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .side-foot b { display: block; color: var(--text); font-weight: 600; font-size: 13px; }
  .mainc { min-width: 0; }
  .pagehead h2 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.015em; white-space: nowrap; }
  .pagehead p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .quick { display: flex; gap: 8px; align-items: flex-end; margin-left: 18px; }
  .quick label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); }
  .quick select { border: 1px solid var(--edge); background: var(--glass); color: var(--text); border-radius: 10px; padding: 6px 10px; font-size: 13px; min-width: 112px; cursor: pointer; }
  .quick select:hover { border-color: var(--sky); }
  .quick select option { background: var(--panel-strong); color: var(--text); }
  .btn.stopall { border-color: rgba(255,107,107,.55); color: var(--fail); background: transparent; padding: 7px 14px; }
  .btn.primary { background: var(--sky); border-color: var(--sky); color: #0E1631; padding: 7px 16px; }
  .view { display: none; padding: 0 28px 40px; flex-direction: column; gap: 18px; }
  body[data-view="dashboard"] #dashView, body[data-view="cases"] #casesView, body[data-view="results"] #resultsView, body[data-view="settings"] #settingsView, body[data-view="scripts"] #scriptsView, body[data-view="bugs"] #bugsView, body[data-view="shift"] #shiftView, body[data-view="team"] #teamView { display: flex; animation: rise .4s var(--ease); }
  body:not([data-view="run"]) .grid { display: none !important; }
  body:not([data-view="run"]) #burger { display: none; }

  /* dashboard */
  .dkpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .dkpi { display: flex; gap: 14px; align-items: center; padding: 16px 18px; }
  .dkpi .ico { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 18px; font-weight: 700; flex: none; }
  .dkpi b { display: block; font-size: 26px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .dkpi span { font-size: 12.5px; color: var(--muted); } .dkpi small { display: block; font-size: 11.5px; color: var(--faint); }
  .ico.t { background: rgba(124,196,255,.16); color: var(--sky); } .ico.p { background: var(--pass-dim); color: var(--pass); }
  .ico.f { background: var(--fail-dim); color: var(--fail); } .ico.s { background: var(--run-dim); color: var(--run); } .ico.r { background: rgba(178,140,255,.16); color: #B28CFF; }
  .dgrid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, .8fr); gap: 18px; align-items: start; }
  .dcol { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .livecard .lhead { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .livecard .lhead h3 { margin: 0; font-size: 16px; } .livecard .ltime { margin-left: auto; font-family: var(--mono); font-size: 14px; font-weight: 500; }
  .livecard .lsub { color: var(--muted); font-size: 12.5px; margin-top: 4px; display: flex; gap: 14px; flex-wrap: wrap; }
  .ltabs { display: flex; gap: 2px; margin: 16px 0 12px; border-bottom: 1px solid var(--edge); }
  .ltabs button { border: 0; background: none; padding: 9px 14px; cursor: pointer; color: var(--muted); font-size: 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .2s, border-color .2s; }
  .ltabs button:hover { color: var(--text); }
  .ltabs button[aria-selected="true"] { color: var(--sky); border-bottom-color: var(--sky); font-weight: 600; }
  .browserframe { border-radius: 14px; overflow: hidden; border: 1px solid var(--edge); background: rgba(0,0,0,.25); }
  .browserframe .bar2 { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: rgba(0,0,0,.25); font-size: 12px; color: var(--muted); }
  .browserframe .bar2 i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; } .bar2 .u { font-family: var(--mono); margin-left: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .browserframe .scr { aspect-ratio: 16 / 10; max-height: 340px; width: 100%; display: grid; place-items: center; color: var(--muted); font-size: 13px; cursor: zoom-in; }
  .browserframe .scr img { width: 100%; height: 100%; object-fit: contain; background: #fff; display: block; }
  .ring { display: flex; gap: 18px; align-items: center; }
  .ring svg { width: 110px; height: 110px; flex: none; }
  .ring .rtxt { font-size: 22px; font-weight: 700; }
  .legend2 { display: grid; gap: 8px; margin-top: 14px; font-size: 13.5px; }
  .legend2 div { display: flex; align-items: center; gap: 10px; } .legend2 i { width: 9px; height: 9px; border-radius: 50%; } .legend2 b { margin-left: auto; font-variant-numeric: tabular-nums; }
  .logs { background: rgba(0,0,0,.32); border-radius: 12px; padding: 10px 12px; font: 12px/1.7 var(--mono); max-height: 280px; overflow: auto; }
  [data-theme="day"] .logs { background: rgba(22,32,63,.88); color: #E8ECF7; }
  .logs { overflow-x: hidden; }
  .logs div { display: grid; grid-template-columns: 66px 64px minmax(0, 1fr); gap: 8px; }
  .logs div span:last-child { overflow-wrap: anywhere; min-width: 0; }
  .dcol > *, .dkpi > div, .mini .row2 > span:first-child { min-width: 0; }
  .mini .row2 > span:first-child { overflow-wrap: anywhere; } .logs .ts { color: #8A95B8; }
  .lv-INFO { color: var(--sky); } .lv-PASS { color: var(--pass); } .lv-ERROR { color: var(--fail); } .lv-WAIT { color: var(--run); }
  .screens { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(170px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
  .shot { border: 1px solid var(--edge); border-radius: 12px; overflow: hidden; background: var(--glass); cursor: zoom-in; text-align: left; padding: 0; color: var(--text); transition: transform .2s var(--ease), border-color .2s; }
  .shot:hover { transform: translateY(-2px); border-color: var(--sky); }
  .shot img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; display: block; background: #fff; }
  .shot span { display: block; padding: 8px 10px 2px; font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shot small { display: block; padding: 0 10px 9px; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini .row2 { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; padding: 9px 6px; border-radius: 10px; cursor: pointer; align-items: center; font-size: 13.5px; }
  .mini .row2:hover { background: var(--glass-2); } .mini .row2 small { display: block; color: var(--muted); font-size: 12px; }

  /* test cases + results */
  .ctool { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .ctool .search { width: 300px; }
  .qbox { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-radius: 14px; background: var(--run-dim); border: 1px solid rgba(255,194,71,.35); font-size: 13.5px; }
  .qbox .qi { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--edge); font-size: 12.5px; }
  table.cases td, table.cases th { vertical-align: middle; }
  table.cases tbody tr:hover td { background: var(--glass-2); }
  .file { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .pill2 { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .pill2.passed { background: var(--pass-dim); color: var(--pass); } .pill2.failed, .pill2.stopped { background: var(--fail-dim); color: var(--fail); }
  .pill2.running { background: var(--run-dim); color: var(--run); } .pill2.none { color: var(--faint); border: 1px solid var(--edge); }
  .btn.sm { padding: 5px 12px; font-size: 12.5px; }

  /* settings */
  .sgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
  .setrow { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .setrow:last-child { border-bottom: 0; }
  .setrow b { display: block; font-weight: 600; font-size: 14px; } .setrow small { color: var(--muted); font-size: 12.5px; }
  .setrow select, .setrow input[type=number] { border: 1px solid var(--edge); background: var(--glass); color: var(--text); border-radius: 10px; padding: 6px 10px; }
  .setrow select option { background: var(--panel-strong); }
  .toggle { position: relative; width: 44px; height: 24px; flex: none; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle span { position: absolute; inset: 0; border-radius: 999px; background: rgba(255,255,255,.15); cursor: pointer; transition: background .2s; }
  .toggle span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); }
  .toggle input:checked + span { background: var(--pass); } .toggle input:checked + span::after { transform: translateX(20px); }
  .wpgrid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-top: 10px; }

  @media (max-width: 1500px) { .quick select { min-width: 92px; padding: 6px 8px; } .quick { margin-left: 10px; gap: 6px; } .pagehead p { display: none; } }
  @media (max-width: 1350px) { .dkpis { grid-template-columns: repeat(3, 1fr); } .dgrid, .sgrid { grid-template-columns: 1fr; } .quick { display: none; } }
  @media (max-width: 1100px) { .shell { grid-template-columns: 74px minmax(0, 1fr); } .side .brand h1, .navitem .lbl, .side-foot div, .navitem .count { display: none; } .navitem { justify-content: center; } }

  /* ===== fit any laptop screen: long text wraps, columns may shrink, wide tables scroll in their own card ===== */
  #results, #results > *, .stage > *, .view > *, .reports > *, .dcol > *, .split2 > *, .sgrid > *, .panel, .flowblock, .kv dd, .note, .problem, .done-card > div { min-width: 0; }
  .note, .note *, .problem p, .kv dd, td, th, small.sub, .url, .tail pre, pre.log, .check-out, .cap, .frow small, .frow b, .dayhead h3 { overflow-wrap: anywhere; word-break: break-word; }
  .panel:has(> table), .day:has(> table), .history { overflow-x: auto; }
  .panel > table, .day > table { min-width: 560px; }
  .done-card { flex-wrap: wrap; } .done-card .again { flex-wrap: wrap; }
  .runhead, .meta { flex-wrap: wrap; } .meta code { overflow-wrap: anywhere; }
  dialog { max-height: calc(100vh - 32px); overflow: auto; }
  @media (max-width: 1440px) { .grid { grid-template-columns: 300px minmax(0, 1fr) 320px; } .kpis { grid-template-columns: repeat(3, 1fr); } }
  /* laptops: icon-only sidebar (names show as tooltips) so the run area gets the room */
  @media (max-width: 1440px) {
    .shell { grid-template-columns: 74px minmax(0, 1fr); }
    .side { padding: 18px 10px; } .side .brand { justify-content: center; padding: 4px 0 16px; } .side .brand h1, .navitem .lbl, .side-foot div { display: none; }
    .navitem { justify-content: center; padding: 11px 0; position: relative; } .navitem .count, .navitem .bcount { position: absolute; top: 4px; right: 6px; margin: 0; }
    .side-foot { justify-content: center; padding: 14px 0 4px; }
    .hero h2 { font-size: 24px; }
  }
  @media (max-width: 1366px) { .grid { grid-template-columns: 280px minmax(0, 1fr) 300px; padding: 0 18px 24px; gap: 14px; } .top { margin: 12px 18px 16px; } .view, .reports { padding: 0 18px 32px; } .hero h2 { font-size: 26px; } }

  /* ===== team dashboard + shift report (rings, bars, leaderboard, issue cards) ===== */
  .tkpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
  .tkpis .kpi b { font-size: 24px; }
  .trow { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: stretch; }
  .rings3 { display: flex; justify-content: space-around; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
  .gauge { text-align: center; } .gauge svg { width: 132px; height: 132px; display: block; margin: 0 auto; }
  .gauge b { display: block; font-size: 13px; margin-top: 6px; } .gauge small { color: var(--muted); font-size: 11.5px; }
  .vbars { display: flex; align-items: flex-end; gap: 14px; height: 190px; padding: 10px 4px 0; }
  .vbar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .vbar .track { width: 100%; max-width: 38px; height: 150px; border-radius: 12px; background: rgba(127,140,180,.14); position: relative; overflow: hidden; display: flex; flex-direction: column-reverse; }
  .vbar .seg { width: 100%; transition: height .6s var(--ease); } .vbar .seg.p { background: linear-gradient(180deg, #9CF3CC, var(--pass)); } .vbar .seg.f { background: linear-gradient(180deg, #FFB0B0, var(--fail)); }
  .vbar .num { font-size: 11px; font-weight: 600; } .vbar .d { font-size: 11px; color: var(--muted); }
  .vbar.today .d { color: var(--tab-sel-text); background: var(--tab-sel); padding: 1px 7px; border-radius: 6px; font-weight: 600; }
  .leader { display: grid; grid-template-columns: 38px minmax(0, 1fr) 46px; gap: 12px; align-items: center; padding: 9px 4px; }
  .leader + .leader { border-top: 1px solid rgba(255,255,255,.06); }
  .ava { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #0E1631; }
  .leader b { display: block; font-size: 13.5px; } .leader small { color: var(--muted); font-size: 11.5px; }
  .lbar { height: 6px; border-radius: 6px; background: rgba(127,140,180,.18); margin-top: 6px; overflow: hidden; } .lbar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--sky), var(--pass)); }
  .leader .pct { font-weight: 700; font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
  .issues { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .issue { border: 1px solid var(--edge); border-radius: 14px; padding: 14px 12px; text-align: center; background: var(--glass); transition: transform .2s var(--ease), border-color .2s; cursor: pointer; }
  .issue:hover { transform: translateY(-2px); border-color: var(--sky); }
  .issue .ic2 { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; margin: 0 auto 8px; font-size: 20px; }
  .issue b { display: block; font-size: 22px; } .issue span { font-size: 12.5px; font-weight: 600; } .issue small { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
  .issue[aria-pressed="true"] { border-color: var(--tab-sel); box-shadow: 0 0 0 2px var(--tab-sel) inset; }
  .tdrop { border: 2px dashed var(--edge); border-radius: 14px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: border-color .2s, background .2s; }
  .tdrop:hover, .tdrop.over { border-color: var(--sky); background: var(--glass-2); }
  .tdrop b { display: block; } .tdrop small { color: var(--muted); }
  .shiftform { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .shiftform .full { grid-column: 1 / -1; }
  @media (max-width: 1700px) { .pagehead p { display: none; } }
  .top .hbtn.icon { flex: none; }
  .shiftform label.check { display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .shiftform label { display: block; font-weight: 600; font-size: 12.5px; margin-bottom: 4px; }
  .shiftform input, .shiftform textarea { width: 100%; padding: 8px 11px; border-radius: 10px; border: 1px solid var(--edge); background: var(--glass); color: var(--text); font: inherit; }
  .shiftform textarea { min-height: 80px; resize: vertical; }
  .shiftbadge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--pass-dim); color: var(--pass); font-weight: 600; font-size: 13px; }
  .shiftbadge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--pass); animation: pulse 1.6s ease-in-out infinite; }
  @media (max-width: 1440px) { .tkpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 1200px) { .trow, .shiftform { grid-template-columns: 1fr; } }

  /* ===== slim category chips (one scrollable row, with counts) ===== */
  .lib .tabs { -webkit-mask-image: linear-gradient(90deg, #000 82%, transparent); mask-image: linear-gradient(90deg, #000 82%, transparent); padding-right: 24px; }
  select.search { color: var(--text); background: var(--glass); } select.search option { background: var(--panel-strong); color: var(--text); }
  .lib .tabs, .tabs { flex-wrap: nowrap !important; overflow-x: auto; gap: 6px; padding-bottom: 4px; scrollbar-width: thin; scroll-snap-type: x proximity; }
  .tabs::-webkit-scrollbar { height: 4px; } .tabs::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 4px; }
  .lib .tabs button, .tabs button { flex: none; padding: 3px 10px; font-size: 12px; border-radius: 8px; white-space: nowrap; scroll-snap-align: start; display: inline-flex; align-items: center; gap: 6px; }
  .tabs button .cnt { font-size: 10.5px; padding: 0 6px; border-radius: 999px; background: rgba(127,140,180,.18); color: inherit; font-variant-numeric: tabular-nums; }
  .tabs button[aria-pressed="true"] .cnt { background: rgba(14,22,49,.18); }
  .catbar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }

<script>
/* ============================================================ wallpaper: funnel rings seen from above */

function stopLiveBg() { if (liveBg) { cancelAnimationFrame(liveBg.raf); liveBg = null; } }
function startLiveBg(kind) {
  stopLiveBg();
  const cv = document.querySelector('#wall canvas.livebg'); if (!cv) return;
  const g = cv.getContext('2d'), day = document.documentElement.dataset.theme === 'day';
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, dpr = Math.min(2, devicePixelRatio || 1);

  size();

  const rnd = (a, b) => a + Math.random() * (b - a);
  const stars = Array.from({ length: 260 }, () => ({ x: rnd(-1, 1), y: rnd(-1, 1), z: rnd(0.05, 1) }));
  const dots = Array.from({ length: Math.round(Math.min(90, (W * H) / 16000)) }, () => ({ x: rnd(0, W), y: rnd(0, H), vx: rnd(-0.35, 0.35), vy: rnd(-0.35, 0.35) }));
  const bg = () => { const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, C.bg1); gr.addColorStop(1, C.bg2); g.fillStyle = gr; g.fillRect(0, 0, W, H); };
  const frame = (t) => {
    bg();
    if (kind === 'stars') {
      const cx = W / 2, cy = H / 2;
      for (const s of stars) {
        if (!still) { s.z -= 0.0035; if (s.z <= 0.02) { s.x = rnd(-1, 1); s.y = rnd(-1, 1); s.z = 1; } }
        const k = 0.9 / s.z, x = cx + s.x * cx * k, y = cy + s.y * cy * k; if (x < 0 || x > W || y < 0 || y > H) { s.z = 1; continue; }
        const r = Math.max(0.4, (1 - s.z) * 2.6); g.fillStyle = `rgba(${s.z > 0.6 ? C.a : C.b},${(1 - s.z) * 0.95 + 0.05})`; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
      }
    } else if (kind === 'waves') {
      const layers = [[C.a, 0.22, 90, 0.0009, 0.0021], [C.b, 0.18, 70, 0.0012, -0.0017], [C.c, 0.12, 55, 0.0015, 0.0013], [C.a, 0.10, 120, 0.0006, -0.0009]];
      layers.forEach(([col, al, amp, f, sp], i) => {
        g.beginPath(); const base = H * (0.45 + i * 0.12);
        for (let x = 0; x <= W; x += 8) { const y = base + Math.sin(x * f * 6 + t * sp) * amp * 0.6 + Math.sin(x * f * 2.3 - t * sp * 0.7) * amp * 0.4; x ? g.lineTo(x, y) : g.moveTo(x, y); }
        g.lineTo(W, H); g.lineTo(0, H); g.closePath(); g.fillStyle = `rgba(${col},${al})`; g.fill();
      });
    } else if (kind === 'network') {
      for (const d of dots) { if (!still) { d.x += d.vx; d.y += d.vy; if (d.x < 0 || d.x > W) d.vx *= -1; if (d.y < 0 || d.y > H) d.vy *= -1; } }
      for (let i = 0; i < dots.length; i++) for (let j = i + 1; j < dots.length; j++) {
        const dx = dots[i].x - dots[j].x, dy = dots[i].y - dots[j].y, dd = dx * dx + dy * dy;
        if (dd < 22000) { g.strokeStyle = `rgba(${C.a},${(1 - dd / 22000) * 0.45})`; g.lineWidth = 1; g.beginPath(); g.moveTo(dots[i].x, dots[i].y); g.lineTo(dots[j].x, dots[j].y); g.stroke(); }
      }
      for (const d of dots) { g.fillStyle = `rgba(${C.b},0.85)`; g.beginPath(); g.arc(d.x, d.y, 2.2, 0, 6.283); g.fill(); }
    } else { // vortex
      const cx = W * 0.5, cy = H * 0.62;
      for (let i = 0; i < 26; i++) {
        const k = i / 25, rx = 40 + k * k * W * 0.75, ry = 14 + k * k * H * 0.42, rot = (still ? 0 : t * 0.00008) * (i % 2 ? 1 : -1) * (1 + k);
        g.save(); g.translate(cx, cy - k * 60); g.rotate(rot); g.strokeStyle = `rgba(${i % 3 === 0 ? C.b : C.a},${0.08 + (1 - k) * 0.4})`; g.lineWidth = 1 + k * 1.6;
        g.setLineDash(i % 4 === 1 ? [14, 10] : []); g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, 6.283); g.stroke(); g.restore();
      }
      g.setLineDash([]); g.fillStyle = `rgba(${C.b},0.5)`; g.beginPath(); g.ellipse(cx, cy, 46, 15, 0, 0, 6.283); g.fill();
    }
  };
  const state = { raf: 0, last: 0 };
  const loop = (t) => { state.raf = requestAnimationFrame(loop); if (document.hidden || t - state.last < 33) return; state.last = t; frame(t); };
  frame(0);
  if (!still) state.raf = requestAnimationFrame(loop);
  liveBg = state;
  window.onresize = () => { size(); frame(performance.now()); };
}

    const c = day ? `rgba(44,111,214,${(0.10 + t * 0.25).toFixed(2)})` : `rgba(124,196,255,${(0.08 + (1 - t) * 0.35).toFixed(2)})`;

/* ============================================================ state + API */
let API = null, scripts = [], runs = [], running = null, viewing = null, logLines = [], onlyKey = false, tick = null;
let group = 'funnel', lastFrame = null, liveMode = 'screen', liveNote = '', ready = true;

  b.disabled = true; b.textContent = 'Continuing…'; await api('/api/continue', { method: 'POST' }).catch(() => {}); });
let seenTests = 0, doneSteps = new Set(), celebrate = null, animateNext = false;

const api = (p, o) => fetch(API + p, { cache: 'no-store', ...o });

async function findServer() {
  for (const base of ['', 'http://localhost:4178', 'http://127.0.0.1:4178']) {
    try { const r = await fetch(base + '/api/health', { cache: 'no-store' }); if (r.ok) return { base, health: await r.json() }; } catch {}
  }
  return null;
}

async function boot() {
  const found = await findServer();
  if (found) {
    API = found.base;
    liveMode = found.health.liveMode || 'screen';
    ready = found.health.ready !== false;
    liveWorker = found.health.liveWorker || 0;
    queueItems = found.health.queue || [];
    scripts = await (await api('/api/scripts')).json();
    try { window.importedMeta = await (await api('/api/imported')).json(); } catch {}
    runs = await (await api('/api/runs')).json();
    if (found.health.running) { running = { ...found.health.running, status: 'running' }; viewing = running; }
    try { const f = await (await api('/api/frame')).json(); if (f && f.data) lastFrame = f; } catch {}
    listen();
  } else {
    try { const pkg = await (await fetch('../package.json', { cache: 'no-store' })).json();
      scripts = Object.entries(pkg.scripts || {}).filter(([k]) => /^(trial|membership|membership-inr|funnel|single|optin|split|app|custom|check|combo):/.test(k)).map(([name, command]) => ({ name, command })); } catch {}
    try { runs = await (await fetch('runs/index.json', { cache: 'no-store' })).json(); } catch { runs = []; }
  }
  $('reportLink').href = (API ? `${API || ''}/playwright-report/index.html` : '../playwright-report/index.html');
  setConn();
  setMode(liveMode, false);
  renderTabs(); renderFlows(); renderStats();
  if (viewing) { await loadLog(viewing.id); startTick(); }
  else if (runs[0]) await openRun(runs[0].id, true);
  renderStage(); renderLive();
}

function renderStats() {
  const el = $('stats'); if (!el) return;
  const real = runs.filter((r) => r.script !== '__setup');
  if (!real.length) { el.innerHTML = ''; return; }
  const last = real[0];
  const recent = real.slice(0, 20), passed = recent.filter((r) => r.status === 'passed').length;
  const today = real.filter((r) => new Date(r.started).toDateString() === new Date().toDateString()).length;
  const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
  const pct = Math.round((passed / recent.length) * 100);
  el.innerHTML = `<div class="stat ${last.status === 'passed' ? 'good' : last.status === 'running' ? '' : 'bad'}"><b>${esc(STATUS[last.status] || last.status)}</b><span>last run, ${ago(last.started)}</span></div>
    <div class="stat ${pct >= 80 ? 'good' : pct < 50 ? 'bad' : ''}"><b>${pct}%</b><span>passed, last ${recent.length}</span></div>
    <div class="stat"><b>${today}</b><span>runs today</span></div>`;
}
const isWaiting = () => !!(running && running.summary && running.summary.waitingForClose);
async function stopOrFinish() {
  if (isWaiting()) {
    await api('/api/finish', { method: 'POST' }).catch(() => {});

    await api('/api/stop', { method: 'POST' }).catch(() => {});

}

  $('connText').textContent = API === null ? 'Reports only - run "npm run dashboard" to start tests'
    : running ? `Running: ${meta(running.script).t}` : !ready ? 'Folder not set up yet' : API ? 'Connected to the dashboard server' : 'Ready to run tests';
}
async function startRun(body) {
  const r = await api('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ label: meta(body.script).t, ...body }) });

function listen() {
  const es = new EventSource(API + '/api/events');
  es.addEventListener('started', (e) => { const d = JSON.parse(e.data); running = { ...d, status: 'running', summary: null }; viewing = running; logLines = []; lastFrame = null; liveNote = '';
    seenTests = 0; doneSteps = new Set(); celebrate = null; animateNext = true; liveWorker = 0; dashRun = running; dashLogs = [];
    syncQuick(); if (view === 'dashboard') renderDash(); if (view === 'cases') renderCases(); renderFlows(); renderStage(); renderLive(); startTick(); setConn(); });
  es.addEventListener('line', (e) => { const d = JSON.parse(e.data); if (viewing && viewing.id === d.id) { logLines.push(d.line); appendLog(d.line); }
    if (running && running.id === d.id) pushDashLog(d.line, nowTime()); });
  es.addEventListener('screen', (e) => { const d = JSON.parse(e.data); if (!running || running.id !== d.id) return;
    (running.screens = running.screens || []).push(d.screen); if (view === 'dashboard') renderDash(); });
  es.addEventListener('queue', (e) => { const d = JSON.parse(e.data); queueItems = d.items || []; if (d.error) toast(d.error); syncQuick(); if (view === 'cases') renderCases(); });
  es.addEventListener('summary', (e) => { const d = JSON.parse(e.data); if (running && running.id === d.id) {
      running.summary = d.summary;
      const tests = d.summary.tests || [];
      for (; seenTests < tests.length; seenTests++) {
        const t = tests[seenTests], ok = t.status === 'passed';
        notify(ok ? 'Test completed successfully' : t.status === 'skipped' ? 'Test skipped' : 'Test failed', t.title, ok);
      }
      if (viewing === running) renderResults();
      syncQuick();
      if (view === 'dashboard') { clearTimeout(window._dashT); window._dashT = setTimeout(renderDash, 400); } } });
  es.addEventListener('frame', (e) => { lastFrame = JSON.parse(e.data); if (liveMode === 'off') return; renderLive();
    if (view === 'dashboard' && dashTab === 'viewport') { const img = $('dImg'); if (img) { swapImage(img, 'data:image/jpeg;base64,' + lastFrame.data); $('dUrl').textContent = lastFrame.url || ''; } else if (running && dashRun && dashRun.id === running.id) $('dTab') && ($('dTab').innerHTML = dashTabHtml(dashRun), bindShots()); } });
  es.addEventListener('live', (e) => { liveNote = JSON.parse(e.data).note || ''; renderLive(); });
  es.addEventListener('finished', async (e) => {
    const rec = JSON.parse(e.data); running = null; stopTick();
    runs = await (await api('/api/runs')).json();
    if (viewing && viewing.id === rec.id) viewing = rec;

  });
  es.onerror = () => { $('connText').textContent = 'Reconnecting to the dashboard server…'; };
  es.onopen = () => { $('connText').textContent = API ? 'Connected to the dashboard server' : 'Ready to run tests'; };
}

  const box = $('reportsView');

  try {
    reportData = API !== null ? await (await api('/api/reports')).json()

function filteredRows() {
  const now = Date.now(), today = dayKey(now);
  const days = { today: 0, '7': 7, '30': 30, all: Infinity }[rf.period];
  const q = rf.q.trim().toLowerCase();
  return reportData.filter((r) => r.script !== '__setup').filter((r) => {
    if (rf.period === 'today') { if (dayKey(r.started) !== today) return false; }
    else if (days !== Infinity && now - r.started > days * 86400000) return false;
    if (rf.cat !== 'all' && groupOf(r.script) !== rf.cat) return false;
    if (rf.status === 'passed' && r.status !== 'passed') return false;
    if (rf.status === 'failed' && !isFail(r)) return false;
    if (q) {
      const hay = [meta(r.script).t, r.script, ...(r.failures || []).map((f) => `${f.flow} ${f.at} ${f.reason}`), ...(r.failedTests || []), r.options && r.options.productId].join(' ').toLowerCase();

  const rows = filteredRows();
  const cats = [...new Set(reportData.filter((r) => r.script !== '__setup').map((r) => groupOf(r.script)))];
  const chip = (key, val, label) => `<button class="rchip" data-f="${key}" data-v="${esc(val)}" aria-pressed="${rf[key] === val}">${esc(label)}</button>`;
  const passed = rows.filter((r) => r.status === 'passed').length, failed = rows.filter(isFail).length;
  const testsRun = rows.reduce((a, r) => a + (r.passed || 0) + (r.failed || 0), 0);
  const secs = rows.reduce((a, r) => a + (r.seconds || 0), 0);
  const pct = rows.length ? Math.round((passed / rows.length) * 100) : 0;

  box.innerHTML = `
    <section class="glass panel rfilters">
      <div class="rrow"><span class="rlab">Period</span>${chip('period', 'today', 'Today')}${chip('period', '7', 'Last 7 days')}${chip('period', '30', 'Last 30 days')}${chip('period', 'all', 'All')}</div>
      <div class="rrow"><span class="rlab">Category</span>${chip('cat', 'all', 'All')}${cats.map((c) => chip('cat', c, c)).join('')}</div>
      <div class="rrow"><span class="rlab">Result</span>${chip('status', 'all', 'All')}${chip('status', 'passed', 'Passed')}${chip('status', 'failed', 'Failed or stopped')}
        <input class="search rsearch" id="rq" type="search" placeholder="Search flows, products, failure text" value="${esc(rf.q)}" aria-label="Search reports">
        <span class="ractions"><button class="hbtn" id="csvBtn">Download CSV</button><button class="hbtn" id="printBtn">Print / save as PDF</button></span></div>
    </section>
    <section class="kpis">
      <div class="glass kpi"><b>${rows.length}</b><span>runs</span></div>
      <div class="glass kpi good"><b>${passed}</b><span>passed</span></div>
      <div class="glass kpi ${failed ? 'bad' : ''}"><b>${failed}</b><span>failed or stopped</span></div>
      <div class="glass kpi ${pct >= 80 ? 'good' : pct < 50 && rows.length ? 'bad' : ''}"><b>${pct}%</b><span>pass rate</span></div>
      <div class="glass kpi"><b>${testsRun}</b><span>tests run</span></div>
      <div class="glass kpi"><b>${dur(secs)}</b><span>total test time</span></div>
    </section>
    ${rows.length ? `<section class="glass panel"><h3>Runs per day</h3>${chartHtml(rows)}</section>${failuresHtml(rows)}${daysHtml(rows)}`
      : `<section class="glass panel"><h3>No runs in this view</h3><p style="color:var(--muted);margin:0">${reportData.length ? 'Try a longer period or clear the filters.' : 'Runs you start from the dashboard are saved here, day by day.'}</p></section>`}`;

  box.querySelectorAll('.rchip').forEach((b) => (b.onclick = () => { rf[b.dataset.f] = b.dataset.v; renderReports(); }));
  const rq = $('rq'); rq.oninput = () => { rf.q = rq.value; clearTimeout(rq.t); rq.t = setTimeout(() => { renderReports(); const n = $('rq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  $('csvBtn').onclick = () => downloadCsv(rows);
  $('printBtn').onclick = () => window.print();
  box.querySelectorAll('[data-open]').forEach((el) => (el.onclick = (e) => { if (e.target.closest('a')) return; setView('runner'); openRun(el.dataset.open); }));

function chartHtml(rows) {
  const first = Math.min(...rows.map((r) => r.started));
  const span = Math.min(30, Math.max(1, Math.ceil((Date.now() - first) / 86400000) + 1));
  const days = Array.from({ length: span }, (_, i) => dayKey(Date.now() - (span - 1 - i) * 86400000));
  const by = Object.fromEntries(days.map((d) => [d, { p: 0, f: 0 }]));
  for (const r of rows) { const k = dayKey(r.started); if (by[k]) r.status === 'passed' ? by[k].p++ : isFail(r) && by[k].f++; }
  const max = Math.max(1, ...days.map((d) => by[d].p + by[d].f));
  const W = 900, H = 170, bw = Math.min(46, (W - 40) / days.length - 6);
  const bars = days.map((d, i) => {
    const x = 30 + i * ((W - 40) / days.length), hp = (by[d].p / max) * (H - 40), hf = (by[d].f / max) * (H - 40);
    const lab = new Date(d + 'T12:00:00').toLocaleDateString([], { day: 'numeric', month: 'short' });
    return `<g><title>${lab}: ${by[d].p} passed, ${by[d].f} failed</title>
      <rect x="${x}" y="${H - 22 - hp}" width="${bw}" height="${hp}" rx="3" fill="var(--pass)"/>
      <rect x="${x}" y="${H - 22 - hp - hf}" width="${bw}" height="${hf}" rx="3" fill="var(--fail)"/>
      ${days.length <= 14 || i % Math.ceil(days.length / 10) === 0 ? `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${lab}</text>` : ''}</g>`;
  }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Passed and failed runs per day">
    <line x1="24" y1="${H - 22}" x2="${W - 6}" y2="${H - 22}" stroke="var(--edge)"/>${bars}</svg>
    <div class="legend"><span><i style="background:var(--pass)"></i>Passed</span><span><i style="background:var(--fail)"></i>Failed or stopped</span></div></div>`;
}

function failuresHtml(rows) {
  const map = new Map();
  for (const r of rows.filter(isFail)) {
    const items = r.failures && r.failures.length ? r.failures.map((f) => ({ at: f.flow || (f.at || '').replace(/\[STEP \d+\/\d+\]\s*/, ''), why: f.reason || '' }))
      : [{ at: r.problem && PROBLEM_TEXT[r.problem] ? 'Setup' : (r.failedTests || [])[0] || meta(r.script).t, why: r.problem && PROBLEM_TEXT[r.problem] ? PROBLEM_TEXT[r.problem].title : r.status === 'stopped' ? 'Stopped by hand' : 'See the run log' }];
    for (const it of items) {
      const key = (it.at + ' | ' + it.why.replace(/"[^"]*"/g, '"…"').replace(/\d+/g, '#')).slice(0, 180);
      const e = map.get(key) || { at: it.at, why: it.why, n: 0, last: 0, id: r.id };
      e.n++; if (r.started > e.last) { e.last = r.started; e.id = r.id; }
      map.set(key, e);
    }
  }
  const top = [...map.values()].sort((a, b) => b.n - a.n || b.last - a.last).slice(0, 6);
  if (!top.length) return '';
  return `<section class="glass panel"><h3>Most common failures</h3>${top.map((f) => `
    <div class="frow" data-open="${esc(f.id)}" tabindex="0"><span class="fcount">${f.n}×</span>
      <div><b>${esc(f.at || 'Unknown step')}</b><small>${esc(f.why)}</small></div><span class="flast">last ${when(f.last)}</span></div>`).join('')}</section>`;
}

function daysHtml(rows) {
  const groups = {};
  for (const r of rows) (groups[dayKey(r.started)] = groups[dayKey(r.started)] || []).push(r);
  return Object.keys(groups).sort().reverse().map((k) => {
    const list = groups[k].sort((a, b) => b.started - a.started);
    const p = list.filter((r) => r.status === 'passed').length, f = list.filter(isFail).length;
    return `<section class="glass panel day"><div class="dayhead"><h3>${esc(dayLabel(k))}</h3>
        <span class="dstat">${list.length} run${list.length > 1 ? 's' : ''}</span><span class="dstat good">${p} passed</span>${f ? `<span class="dstat bad">${f} failed</span>` : ''}
        <span class="dstat">${dur(list.reduce((a, r) => a + (r.seconds || 0), 0))}</span></div>
      <table><thead><tr><th>Time</th><th>Flow</th><th>Category</th><th>Result</th><th>Tests</th><th>Time taken</th><th>Report</th></tr></thead><tbody>
      ${list.map((r) => { const o = r.options || {}; const extra = [r.workers > 1 && `${r.workers} workers`, o.browsers && o.browsers.length && (o.browsers.length > 1 || o.browsers[0] !== 'chromium') && o.browsers.map(browserName).join(' + '), o.productId && `QA ${o.productId}`].filter(Boolean).join(', ');
        const why = isFail(r) ? ((r.failures || [])[0] ? r.failures[0].reason : r.problem && PROBLEM_TEXT[r.problem] ? PROBLEM_TEXT[r.problem].title : '') : '';
        return `<tr class="rrun" data-open="${esc(r.id)}" tabindex="0"><td class="num">${new Date(r.started).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
          <td>${esc(meta(r.script).t)}${extra ? `<small class="sub">${esc(extra)}</small>` : ''}${why ? `<small class="sub bad">${esc(why.slice(0, 140))}</small>` : ''}</td>
          <td>${esc(groupOf(r.script))}</td><td class="st ${r.status}">${esc(STATUS[r.status] || r.status)}</td>
          <td class="num">${r.passed || 0} passed${r.failed ? `, ${r.failed} failed` : ''}</td><td class="num">${dur(r.seconds || 0)}</td>
          <td>${r.report ? `<a href="${API !== null ? `${API}/dashboard/${r.report}` : r.report}" target="_blank" rel="noopener">Playwright</a>` : '<span style="color:var(--faint)">–</span>'}</td></tr>`; }).join('')}
      </tbody></table></section>`;
  }).join('');
}

function downloadCsv(rows) {
  const head = ['date', 'time', 'flow', 'category', 'result', 'tests_passed', 'tests_failed', 'duration_seconds', 'workers', 'browsers', 'product_id', 'failure'];
  const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = rows.map((r) => { const d = new Date(r.started), o = r.options || {};
    return [dayKey(r.started), d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), meta(r.script).t, groupOf(r.script), r.status, r.passed || 0, r.failed || 0, r.seconds || 0,
      r.workers || 1, (o.browsers || []).join('+'), o.productId || '', (r.failures || [])[0] ? `${r.failures[0].at} - ${r.failures[0].reason}` : ''].map(q).join(','); });
  const blob = new Blob([[head.join(','), ...lines].join('\n')], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `flexifunnels-test-report-${dayKey(Date.now())}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

const VIEWS = {
  dashboard: ['Automation Dashboard', 'Run, monitor and analyze your Playwright tests in real time'],
  run: ['Run Tests', 'Pick a flow, start it and watch it run'],
  cases: ['Test Cases', 'Every flow with its last result. Tick several to run them one after another'],
  results: ['Test Results', 'Every run, newest first'],
  reports: ['Reports', 'Daily reports, pass rates and the most common failures'],
  scripts: ['Custom Scripts', 'Import, write and run your own scenarios'],
  bugs: ['Bug Sheet', 'Bugs found while testing: steps, screenshots, open / closed, PDF'],
  shift: ['Shift Report', 'End of shift: your runs and bugs as a report file for your team lead'],
  team: ['Team Dashboard', 'Import your team\'s shift reports and see the team\'s analysis'],
  settings: ['Settings', 'Defaults for new runs, notifications, data and the look of the dashboard'],
};
function setView(v) {
  if (v === 'runner') v = 'run';
  view = VIEWS[v] ? v : 'dashboard';
  document.body.dataset.view = view;
  document.body.classList.toggle('view-reports', view === 'reports');
  document.querySelectorAll('.navitem').forEach((b) => b.setAttribute('aria-current', b.dataset.view === view ? 'page' : 'false'));
  $('pageTitle').textContent = VIEWS[view][0]; $('pageSub').textContent = VIEWS[view][1];
  try { history.replaceState(null, '', '#' + view); } catch {}
  if (view === 'reports') loadReports();
  if (view === 'dashboard') renderDash();
  if (view === 'cases') renderCases();
  if (view === 'results') renderResultsView();
  if (view === 'settings') renderSettings();
  if (view === 'shift') renderShift();
  if (view === 'team') { renderTeam(); loadTeam().then(renderTeam); }
  if (view === 'scripts') { loadImported().then(renderScripts); renderScripts(); }
  if (view === 'bugs') { renderBugs(); loadBugs().then(renderBugs); }
  window.scrollTo({ top: 0 });
}
document.addEventListener('click', (e) => { const b = e.target.closest('.navitem'); if (b) setView(b.dataset.view); });

/* ============================================================ defaults (header quick controls + settings) */
const pref = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } };
const setPref = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const savedMode = () => pref('ff-mode', 'headed');
function syncQuick() {
  $('qBrowser').value = savedBrowsers().join(',');
  if (!$('qBrowser').value) $('qBrowser').value = 'chromium';
  $('qMode').value = savedMode(); $('qWorkers').value = String(savedWorkers());
  $('qStop').hidden = !running;
  $('qStop').textContent = isWaiting() ? 'Finish run' : 'Stop';
  $('qStop').className = 'btn ' + (isWaiting() ? 'go' : 'stopall');
  $('navRunning').hidden = !running;
  const qn = queueItems.length; $('navQueue').hidden = !qn; $('navQueue').textContent = qn ? `${qn} queued` : '';
}
$('qBrowser').onchange = () => { setPref('ff-browsers', $('qBrowser').value);
  if ($('qBrowser').value === 'firefox') toast('Firefox runs normally, but has no live view on the dashboard (Chromium and Edge do).'); };
$('qMode').onchange = () => { setPref('ff-mode', $('qMode').value); };
$('qWorkers').onchange = () => { setPref('ff-workers', $('qWorkers').value); };
$('qRun').onclick = () => setView('cases');
$('endShift').onclick = () => setView('shift');
$('qStop').onclick = async () => { $('qStop').disabled = true; await stopOrFinish(); setTimeout(() => ($('qStop').disabled = false), 3000); };
/** The defaults every new run uses (the run panel can still change them). */
const runDefaults = () => ({ browsers: savedBrowsers(), workers: savedWorkers(), headless: savedMode() === 'headless',
  closeWhenDone: pref('ff-close', '0') === '1', manualWait: Number(pref('ff-manual-wait', '5')), manualAssist: pref('ff-manual', '1') === '1' });

/* ============================================================ queue */
let queueItems = [];
async function runQueue(names) {
  const items = names.map((n) => ({ script: n, label: meta(n).t }));
  const r = await api('/api/queue', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items, options: runDefaults() }) }).catch(() => null);
  if (!r || !r.ok) { toast('Could not start the selected tests'); return; }
  queueItems = (await r.json()).items || [];
  toast(`${names.length} test${names.length > 1 ? 's' : ''} queued: they run one after another`);
  syncQuick(); if (view === 'cases') renderCases();
}

/* ============================================================ dashboard */
let dashRun = null, dashLogs = [], dashTab = 'viewport';
const nowTime = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
function logLevel(l) {
  if (/✅|✓|PASSED|passed\b|COMPLETED/.test(l)) return 'PASS';
  if (/❌|✘|Error|FAILED|failed\b/.test(l)) return 'ERROR';
  if (/✋|MANUAL STEP/.test(l)) return 'WAIT';
  return 'INFO';
}
function pushDashLog(line, ts) {
  if (!KEY.test(line) || /^[=#!~]{10,}/.test(line.trim())) return;
  dashLogs.push({ ts: ts || '', lv: logLevel(line), msg: line.replace(/^>>>\s*/, '').trim() });
  if (dashLogs.length > 200) dashLogs.shift();
  if (view === 'dashboard') { const box = $('dLogs'); if (box) { box.insertAdjacentHTML('beforeend', logRow(dashLogs[dashLogs.length - 1])); box.scrollTop = box.scrollHeight; } }
}
const logRow = (l) => `<div><span class="ts">${esc(l.ts)}</span><span class="lv-${l.lv}">[${l.lv}]</span><span>${esc(l.msg)}</span></div>`;
async function loadDashRun() {
  if (running) { dashRun = running; return; }
  const last = runs.find((r) => r.script !== '__setup');
  if (!last) { dashRun = null; return; }
  if (dashRun && dashRun.id === last.id && dashRun.summary) return;
  try {
    dashRun = API !== null ? await (await api(`/api/runs/${last.id}`)).json() : await (await fetch(`runs/${last.id}.json`, { cache: 'no-store' })).json();
    const txt = await (await (API !== null ? api(`/api/runs/${last.id}/log`) : fetch(`runs/${last.id}.log`))).text();
    dashLogs = []; txt.split(/\r?\n/).forEach((l) => pushDashLog(l, ''));
  } catch { dashRun = null; }
}
function counts(v) {
  const s = (v && v.summary) || {}, t = s.tests || [];
  const passed = Math.max(s.passed || 0, t.filter((x) => x.status === 'passed').length);
  const failed = Math.max(s.failed || 0, t.filter((x) => /failed|timedout|interrupted/.test(x.status)).length);
  const skipped = Math.max(s.skipped || 0, t.filter((x) => x.status === 'skipped').length);
  const total = Math.max(s.total || 0, passed + failed + skipped);
  return { passed, failed, skipped, total, done: passed + failed + skipped };
}
async function renderDash() {
  const box = $('dashView'); if (!box) return;
  await loadDashRun();
  const v = dashRun, c = counts(v), isLive = v && running && v.id === running.id;
  const rate = c.passed + c.failed ? Math.round((c.passed / (c.passed + c.failed)) * 100) : 0;
  const prev = runs.filter((r) => r.script !== '__setup' && (!v || r.id !== v.id) && (r.passed || r.failed))[0];
  const prevRate = prev ? Math.round(((prev.passed || 0) / ((prev.passed || 0) + (prev.failed || 0))) * 100) : null;
  const delta = prevRate === null || !(c.passed + c.failed) ? '' : `${rate - prevRate >= 0 ? '+' : ''}${rate - prevRate}% from last run`;
  const pctOf = (n) => (c.total ? `${Math.round((n / c.total) * 100)}%` : '0%');
  const o = (v && v.options) || {};
  const st = v ? stOf(v) : 'none';
  const running1 = isLive && c.done < c.total ? 1 : 0, pending = Math.max(0, c.total - c.done - running1);
  const pct = c.total ? Math.round((c.done / c.total) * 100) : v && v.status === 'passed' ? 100 : 0;
  const R = 46, C = 2 * Math.PI * R;
  const s = (v && v.summary) || {};
  const flows = [...new Set((s.steps || []).map((x) => x.flow))];
  const lastFlow = flows[flows.length - 1];
  const stepList = (s.steps || []).filter((x) => x.flow === lastFlow).sort((a, b) => a.n - b.n);
  const screens = (v && v.screens) || [];
  box.innerHTML = `
    <section class="dkpis">
      <div class="glass dkpi"><span class="ico t">≡</span><div><span>Total tests</span><b>${c.total}</b><small>${v ? esc(meta(v.script).t).slice(0, 34) : 'no runs yet'}</small></div></div>
      <div class="glass dkpi"><span class="ico p">✓</span><div><span>Passed</span><b>${c.passed}</b><small>${pctOf(c.passed)} pass</small></div></div>
      <div class="glass dkpi"><span class="ico f">✕</span><div><span>Failed</span><b>${c.failed}</b><small>${pctOf(c.failed)} fail</small></div></div>
      <div class="glass dkpi"><span class="ico s">⊘</span><div><span>Skipped</span><b>${c.skipped}</b><small>${pctOf(c.skipped)} skipped</small></div></div>
      <div class="glass dkpi"><span class="ico r">%</span><div><span>Pass rate</span><b>${rate}%</b><small>${delta ? esc(delta) : '&nbsp;'}</small></div></div>
    </section>
    <div class="dgrid">
      <div class="dcol">
        <section class="glass panel livecard">
          <div class="lhead"><h3>${isLive ? 'Live test run' : 'Last test run'}</h3>${v ? `<span class="status ${st}">${STATUS[st] || st}</span>` : ''}
            <span class="ltime" id="dTime">${v ? dur(isLive ? Math.round((Date.now() - v.started) / 1000) : v.seconds || 0) : ''}</span></div>
          ${v ? `<div style="margin-top:8px;font-weight:600">${esc(meta(v.script).t)}</div>
          <div class="lsub"><span>${esc((o.browsers || ['chromium']).map(browserName).join(' + '))}</span><span>${o.headless ? 'Headless' : 'Headed'}</span><span>Workers: ${o.workers || 1}</span><span>${when(v.started)}</span></div>
          <div class="bar ${isLive ? 'live' : ''}"><div style="width:${pct}%;${st === 'failed' ? 'background:var(--fail)' : ''}"></div></div>
          <div class="meta" style="justify-content:space-between"><span>${c.done} / ${c.total || '?'} tests completed</span><span>${pct}%</span></div>
          ${stepList.length ? `<div class="steps" style="margin-top:12px">${stepList.map((x) => `<span class="step ${x.state === 'running' && !isLive ? 'failed' : x.state}"><span class="n">${x.n}</span>${esc(x.title)}</span>`).join('')}</div>` : ''}
          <div class="ltabs" role="tablist">${[['viewport', 'Browser viewport'], ['steps', 'Test steps'], ['logs', 'Console logs'], ['screens', 'Screenshots']].map(([k, t]) => `<button role="tab" data-dt="${k}" aria-selected="${dashTab === k}">${t}</button>`).join('')}</div>
          <div id="dTab">${dashTabHtml(v)}</div>`
          : `<p style="color:var(--muted);margin:10px 0 0">No runs yet. Press <b>Run tests</b> at the top to pick what to run.</p>`}
        </section>
      </div>
      <div class="dcol">
        <section class="glass panel"><h3>Test execution progress</h3>
          <div class="ring"><svg viewBox="0 0 110 110" aria-hidden="true"><circle cx="55" cy="55" r="${R}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="10"/>
            <circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--pass)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct / 100)}" transform="rotate(-90 55 55)" style="transition:stroke-dashoffset .6s var(--ease)"/>
            <text x="55" y="61" text-anchor="middle" fill="var(--text)" font-size="20" font-weight="700">${pct}%</text></svg>
            <div><b>${c.done} / ${c.total || 0}</b><div style="color:var(--muted);font-size:13px">tests completed</div></div></div>
          <div class="legend2">
            <div><i style="background:var(--pass)"></i>Passed<b>${c.passed}</b></div><div><i style="background:var(--fail)"></i>Failed<b>${c.failed}</b></div>
            <div><i style="background:var(--run)"></i>Skipped<b>${c.skipped}</b></div><div><i style="background:var(--sky)"></i>Running<b>${running1}</b></div>
            <div><i style="background:transparent;border:1px solid var(--muted)"></i>Pending<b>${pending}</b></div></div>
        </section>
        <section class="glass panel"><div style="display:flex;align-items:center"><h3 style="margin:0">Recent logs</h3>
          <button class="hbtn" style="margin-left:auto" data-goto="run">View all</button></div>

  const pre = { title: `${meta(v.script).t}: ${f ? (f.at || 'failed').replace(/\[STEP \d+\/\d+\]\s*/, '') : STATUS[v.status] || v.status}`.slice(0, 190),
    scenario: `Flow: ${meta(v.script).t}\nRun: ${when(v.started)} (npm run ${v.script})\n\n${steps}`, expected: 'The flow completes and reaches the Thank You page.',
    actual: f ? f.reason : (logLines.filter((l) => /Error|failed|❌/.test(l)).slice(-3).join('\n') || 'The run did not finish.'), severity: 'High', flow: meta(v.script).t, runId: v.id, screenshots: [] };
  const shot = (s.screenshots || [])[0];
  if (shot && API !== null) {
    const rel = 'test-results/' + shot.split(/[\\/]test-results[\\/]/).pop().replace(/\\/g, '/');
    const r = await api('/api/bugs/image', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fromFile: rel }) }).then((x) => x.json()).catch(() => ({}));

/* ============================================================ animated favicon (state-aware) */
(function favicon() {
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  let link = document.querySelector('link[rel="icon"]'); if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
  let t = 0;
  const draw = () => {
    t += 1;
    const st = running ? (running.summary && running.summary.manual ? 'wait' : 'run') : (runs[0] && runs[0].status === 'passed' ? 'ok' : runs[0] && /failed|stopped/.test(runs[0].status) ? 'bad' : 'idle');
    g.clearRect(0, 0, 64, 64);
    g.fillStyle = '#141A33'; g.beginPath(); g.roundRect ? g.roundRect(2, 2, 60, 60, 16) : g.rect(2, 2, 60, 60); g.fill();
    const rings = [[26, 14, '#3A4A86'], [18, 9.5, '#7CC4FF'], [10, 5.2, '#3DDC97']];
    rings.forEach(([rx, ry, col], i) => {
      g.save(); g.translate(32, 32); g.rotate((st === 'run' || st === 'wait' ? t * (0.06 + i * 0.03) : 0) * (i % 2 ? -1 : 1));
      g.strokeStyle = col; g.lineWidth = 4; g.setLineDash(i === 1 ? [9, 6] : []); g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); g.stroke(); g.restore();
    });
    const dot = { run: '#FFC247', wait: '#FFC247', ok: '#3DDC97', bad: '#FF6B6B', idle: null }[st];
    if (dot) { const pulse = st === 'run' || st === 'wait' ? 1 + 0.25 * Math.sin(t / 3) : 1; g.fillStyle = dot; g.beginPath(); g.arc(50, 14, 9 * pulse, 0, Math.PI * 2); g.fill(); g.strokeStyle = '#141A33'; g.lineWidth = 3; g.stroke(); }
    link.href = c.toDataURL('image/png');
  };
  draw(); setInterval(draw, 160);
})();

    tones.forEach((f, i) => { const o = ac.createOscillator(), gn = ac.createGain(); o.frequency.value = f; o.connect(gn); gn.connect(ac.destination);
      gn.gain.setValueAtTime(0.12, ac.currentTime + i * 0.18); gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + i * 0.18 + 0.16); o.start(ac.currentTime + i * 0.18); o.stop(ac.currentTime + i * 0.18 + 0.17); });
  } catch {}
}

  const R = 52, C = 2 * Math.PI * R, p = Math.max(0, Math.min(100, Math.round(pct || 0)));
  return `<div class="gauge"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="${R}" fill="none" stroke="rgba(127,140,180,.18)" stroke-width="11"/>
    <circle cx="66" cy="66" r="${R}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p / 100)}" transform="rotate(-90 66 66)" style="transition:stroke-dashoffset .8s var(--ease)"/>
    <circle cx="${66 + R * Math.cos(-Math.PI / 2 + (2 * Math.PI * p) / 100)}" cy="${66 + R * Math.sin(-Math.PI / 2 + (2 * Math.PI * p) / 100)}" r="6" fill="#fff" stroke="${color}" stroke-width="3"/>
    <text x="66" y="66" text-anchor="middle" fill="var(--text)" font-size="24" font-weight="700">${p}%</text><text x="66" y="86" text-anchor="middle" fill="var(--muted)" font-size="10.5">${esc(sub)}</text></svg><b>${esc(label)}</b></div>`;
}
function renderTeam() {
  const box = $('teamView'); if (!box) return;
  const list = teamFiltered();
  const members = [...new Set(teamReports.map((r) => r.member.name))].sort();
  const runsAll = list.flatMap((r) => (r.runs || []).map((x) => ({ ...x, member: r.member.name })));
  const bugsAll = [...new Map(list.flatMap((r) => (r.bugs || []).map((b) => ({ ...b, member: r.member.name }))).map((b) => [`${b.member}|${b.id}`, b])).values()];
  const passed = runsAll.filter((x) => x.status === 'passed').length;
  const hours = list.reduce((a, r) => a + (r.shift.hours || 0), 0);
  const testSec = runsAll.reduce((a, x) => a + (x.seconds || 0), 0);
  const closedB = bugsAll.filter((b) => b.status === 'Closed').length;
  const passRate = runsAll.length ? (passed / runsAll.length) * 100 : 0;
  const util = hours ? Math.min(100, (testSec / 3600 / hours) * 100) : 0;
  // per member
  const per = members.filter((m) => teamMember === 'all' || m === teamMember).map((m) => {
    const rs = list.filter((r) => r.member.name === m), xr = runsAll.filter((x) => x.member === m), xb = bugsAll.filter((b) => b.member === m);
    const p = xr.filter((x) => x.status === 'passed').length;
    return { name: m, role: (rs[0] && rs[0].member.role) || '', shifts: rs.length, hours: rs.reduce((a, r) => a + (r.shift.hours || 0), 0), runs: xr.length, passed: p,
      failed: xr.filter((x) => x.status === 'failed').length, rate: xr.length ? Math.round((p / xr.length) * 100) : 0, bugs: xb.length, open: xb.filter((b) => b.status === 'Open').length,
      closed: xb.filter((b) => b.status === 'Closed').length, flows: new Set(xr.map((x) => x.title)).size, last: rs[0] ? rs[0].shift.end : 0,
      score: xr.length + p + xb.length * 3 + xb.filter((b) => b.status === 'Closed').length * 2 };
  }).filter((x) => x.shifts);
  const maxScore = Math.max(1, ...per.map((x) => x.score));
  // activity: last 7 days (or the filtered span)
  const span = teamPeriod === 'today' ? 1 : 7;
  const days = Array.from({ length: span }, (_, i) => dayKey(Date.now() - (span - 1 - i) * 86400000));
  const byDay = Object.fromEntries(days.map((d) => [d, { p: 0, f: 0 }]));
  for (const x of runsAll) { const k = dayKey(x.started); if (byDay[k]) x.status === 'passed' ? byDay[k].p++ : byDay[k].f++; }
  const maxDay = Math.max(1, ...days.map((d) => byDay[d].p + byDay[d].f));
  // issues
  const issueText = [...bugsAll.map((b) => ({ t: `${b.title} ${b.actual || ''}`, kind: 'bug', ref: b })), ...runsAll.filter((x) => x.status !== 'passed' && x.failure).map((x) => ({ t: x.failure, kind: 'run', ref: x }))];
  const issueCount = (it) => it.key === 'bug' ? bugsAll.length : issueText.filter((x) => it.test(x.t)).length;
  const bugRows = teamIssue && teamIssue !== 'bug' ? issueText.filter((x) => ISSUE_TYPES.find((i) => i.key === teamIssue).test(x.t)) : bugsAll.map((b) => ({ t: b.title, kind: 'bug', ref: b }));
  box.innerHTML = `
    <section class="glass panel"><div class="ctool">
      <div class="tdrop" id="tDrop" tabindex="0" style="flex:1;min-width:260px"><span style="font-size:24px">📥</span><div><b>Import team shift reports</b><small>Drop the shift-report-….json files here, or click to choose (several at once). ${teamReports.length} imported.</small></div></div>
      <input type="file" id="tFiles" accept=".json" multiple hidden>
      <span class="catbar">${[['today', 'Today'], ['7', '7 days'], ['30', '30 days'], ['all', 'All']].map(([k, t]) => `<button class="rchip" data-tp="${k}" aria-pressed="${teamPeriod === k}">${t}</button>`).join('')}</span>
      <select class="search" id="tMem" style="width:auto"><option value="all">Everyone</option>${members.map((m) => `<option ${teamMember === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select>
      <span style="display:flex;gap:8px;margin-left:auto"><button class="btn" id="tCsv">CSV</button><button class="btn" id="tPdf">Team PDF</button></span></div></section>
    ${!teamReports.length ? `<section class="glass panel"><h3>No team data yet</h3><p style="color:var(--muted);margin:0">Each team member opens <b>Shift Report</b> at the end of their shift and presses <b>End shift &amp; download report</b>. Import those files above to see the team's analysis here.</p></section>` : `
    <section class="tkpis">
      <div class="glass kpi"><b>${per.length}</b><span>team members</span></div><div class="glass kpi"><b>${list.length}</b><span>shifts</span></div>
      <div class="glass kpi"><b>${Math.round(hours * 10) / 10} h</b><span>shift hours</span></div><div class="glass kpi"><b>${runsAll.length}</b><span>test runs</span></div>
      <div class="glass kpi ${passRate >= 80 ? 'good' : passRate < 50 && runsAll.length ? 'bad' : ''}"><b>${Math.round(passRate)}%</b><span>pass rate</span></div>
      <div class="glass kpi ${bugsAll.length - closedB ? 'bad' : ''}"><b>${bugsAll.length}</b><span>bugs (${bugsAll.length - closedB} open)</span></div></section>
    <div class="trow">
      <section class="glass panel"><h3>Team health</h3><div class="rings3">
        ${gaugeSvg(passRate, 'var(--pass)', 'Pass rate', `${passed} of ${runsAll.length} runs`)}
        ${gaugeSvg(bugsAll.length ? (closedB / bugsAll.length) * 100 : 0, 'var(--sky)', 'Bugs closed', `${closedB} of ${bugsAll.length}`)}
        ${gaugeSvg(util, 'var(--run)', 'Test time / shift', `${dur(testSec)} of ${Math.round(hours * 10) / 10} h`)}</div></section>
      <section class="glass panel"><h3>Team activity <small style="color:var(--muted);font-weight:400">(runs per day)</small></h3>
        <div class="vbars">${days.map((d) => { const v = byDay[d], tot = v.p + v.f;
          return `<div class="vbar ${d === dayKey(Date.now()) ? 'today' : ''}" title="${d}: ${v.p} passed, ${v.f} failed"><span class="num">${tot || ''}</span><div class="track"><div class="seg p" style="height:${(v.p / maxDay) * 100}%"></div><div class="seg f" style="height:${(v.f / maxDay) * 100}%"></div></div>
            <span class="d">${new Date(d + 'T12:00:00').toLocaleDateString([], { weekday: 'short' })}</span></div>`; }).join('')}</div>
        <div class="legend"><span><i style="background:var(--pass)"></i>Passed</span><span><i style="background:var(--fail)"></i>Failed / stopped</span></div></section></div>
    <div class="trow">
      <section class="glass panel"><h3>Top contributors</h3>${per.slice().sort((a, b) => b.score - a.score).map((m) => `
        <div class="leader"><span class="ava" style="background:${avaColor(m.name)}">${esc(initials(m.name))}</span>
          <div><b>${esc(m.name)}</b><small>${esc(m.role || 'Team member')} · ${m.runs} runs · ${m.bugs} bugs · ${Math.round(m.hours * 10) / 10} h</small><div class="lbar"><i style="width:${Math.round((m.score / maxScore) * 100)}%"></i></div></div>
          <span class="pct">${m.rate}%</span></div>`).join('')}</section>
      <section class="glass panel"><h3>Issues found <small style="color:var(--muted);font-weight:400">(bugs + failed runs; click to filter)</small></h3>
        <div class="issues">${ISSUE_TYPES.map((it) => `<button class="issue" data-iss="${it.key}" aria-pressed="${teamIssue === it.key}"><span class="ic2" style="background:${it.bg}">${it.icon}</span><b>${issueCount(it)}</b><span>${it.label}</span></button>`).join('')}</div></section></div>
    <section class="glass panel"><h3>Team members</h3><table class="cases"><thead><tr><th>Member</th><th>Shifts</th><th>Hours</th><th>Runs</th><th>Passed</th><th>Failed</th><th>Pass rate</th><th>Bugs (open / closed)</th><th>Flows</th><th>Last shift</th></tr></thead><tbody>
      ${per.map((m) => `<tr><td><span class="ava" style="background:${avaColor(m.name)};width:28px;height:28px;font-size:11px;display:inline-grid;vertical-align:middle;margin-right:8px">${esc(initials(m.name))}</span><b style="font-weight:600">${esc(m.name)}</b><small class="sub">${esc(m.role)}</small></td>
        <td class="num">${m.shifts}</td><td class="num">${Math.round(m.hours * 10) / 10}</td><td class="num">${m.runs}</td><td class="num" style="color:var(--pass)">${m.passed}</td><td class="num" style="color:${m.failed ? 'var(--fail)' : 'inherit'}">${m.failed}</td>
        <td><span class="pill2 ${m.rate >= 80 ? 'passed' : m.rate < 50 ? 'failed' : 'running'}">${m.rate}%</span></td><td class="num">${m.open} / ${m.closed}</td><td class="num">${m.flows}</td><td class="num">${m.last ? when(m.last) : '–'}</td></tr>`).join('')}</tbody></table></section>
    <section class="glass panel"><h3>${teamIssue && teamIssue !== 'bug' ? `Issues: ${esc(ISSUE_TYPES.find((i) => i.key === teamIssue).label)}` : 'Team bugs'} <small style="color:var(--muted);font-weight:400">(${bugRows.length})</small>${teamIssue ? ' <button class="iconbtn" id="tIssClear">show all</button>' : ''}</h3>
      <table class="cases"><thead><tr><th>Who</th><th>What</th><th>Severity / result</th><th>Status</th><th>When</th></tr></thead><tbody>
      ${bugRows.slice(0, 200).map((x) => x.kind === 'bug' ? `<tr><td>${esc(x.ref.member)}</td><td><span class="bugid">${esc(x.ref.id)}</span> <b style="font-weight:600">${esc(x.ref.title)}</b>${x.ref.actual ? `<small class="sub bad">${esc(x.ref.actual.slice(0, 160))}</small>` : ''}</td>
          <td><span class="sev ${esc(x.ref.severity)}">${esc(x.ref.severity)}</span></td><td><span class="stbtn ${x.ref.status}" style="cursor:default">${x.ref.status}</span></td><td class="num">${when(x.ref.created)}</td></tr>`
        : `<tr><td>${esc(x.ref.member)}</td><td><b style="font-weight:600">${esc(x.ref.title)}</b><small class="sub bad">${esc(String(x.ref.failure).slice(0, 160))}</small></td><td><span class="pill2 failed">run ${esc(x.ref.status)}</span></td><td>–</td><td class="num">${when(x.ref.started)}</td></tr>`).join('') || '<tr><td colspan="5" style="color:var(--muted)">Nothing here.</td></tr>'}
      </tbody></table></section>
    <section class="glass panel"><h3>Imported reports <small style="color:var(--muted);font-weight:400">(${teamReports.length})</small> <button class="iconbtn danger" id="tClear" style="float:right">Remove all</button></h3>
      <table class="cases"><tbody>${teamReports.map((r) => `<tr><td><b style="font-weight:600">${esc(r.member.name)}</b><small class="sub">${esc(r.member.role || '')}</small></td><td class="num">${when(r.shift.start)} → ${new Date(r.shift.end).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
        <td class="num">${r.shift.hours} h</td><td class="num">${(r.summary || {}).runs || 0} runs · ${(r.bugs || []).length} bugs</td><td style="max-width:320px">${r.notes ? `<small class="sub">${esc(r.notes.slice(0, 140))}</small>` : ''}${r.blockers ? `<small class="sub bad">Blocker: ${esc(r.blockers.slice(0, 120))}</small>` : ''}</td>
        <td style="text-align:right;white-space:nowrap"><button class="iconbtn" data-tprint="${esc(r._file)}">PDF</button><button class="iconbtn danger" data-tdel="${esc(r._file)}">✕</button></td></tr>`).join('')}</tbody></table></section>`}`;
  // wiring
  const importFiles = async (fl) => {
    let ok = 0, bad = [];
    for (const f of fl) {
      try { const text = await f.text(); JSON.parse(text);
        const r = await api('/api/team/import', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: text }); const j = await r.json().catch(() => ({}));
        r.ok ? ok++ : bad.push(`${f.name}: ${j.error || 'failed'}`);
      } catch { bad.push(`${f.name}: not a JSON file`); }
    }
    await loadTeam(); renderTeam();
    toast(`${ok} report${ok === 1 ? '' : 's'} imported${bad.length ? `, ${bad.length} skipped` : ''}`); if (bad.length) alert(bad.join('\n'));
  };
  const drop = $('tDrop');
  drop.onclick = () => $('tFiles').click(); drop.onkeydown = (e) => { if (e.key === 'Enter') $('tFiles').click(); };
  $('tFiles').onchange = () => { importFiles([...$('tFiles').files]); $('tFiles').value = ''; };
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); }; drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); importFiles([...e.dataTransfer.files]); };
  box.querySelectorAll('[data-tp]').forEach((b) => (b.onclick = () => { teamPeriod = b.dataset.tp; renderTeam(); }));
  $('tMem').onchange = () => { teamMember = $('tMem').value; renderTeam(); };
  box.querySelectorAll('[data-iss]').forEach((b) => (b.onclick = () => { teamIssue = teamIssue === b.dataset.iss ? null : b.dataset.iss; renderTeam(); }));
  if ($('tIssClear')) $('tIssClear').onclick = () => { teamIssue = null; renderTeam(); };
  box.querySelectorAll('[data-tdel]').forEach((b) => (b.onclick = async () => { if (!confirm('Remove this report from the team dashboard?')) return; await api(`/api/team?file=${encodeURIComponent(b.dataset.tdel)}`, { method: 'DELETE' }); await loadTeam(); renderTeam(); }));
  box.querySelectorAll('[data-tprint]').forEach((b) => (b.onclick = () => { const r = teamReports.find((x) => x._file === b.dataset.tprint); if (r) printShiftReports([r], `Shift report: ${r.member.name}`); }));
  if ($('tClear')) $('tClear').onclick = async () => { if (!confirm('Remove ALL imported reports?')) return; await api('/api/team?all=1', { method: 'DELETE' }); await loadTeam(); renderTeam(); };
  $('tPdf').onclick = () => { if (!list.length) { toast('No reports in this view'); return; } printShiftReports(list, `Team report (${teamMember === 'all' ? 'everyone' : teamMember}, ${{ today: 'today', '7': 'last 7 days', '30': 'last 30 days', all: 'all time' }[teamPeriod]})`); };
  $('tCsv').onclick = () => {
    const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = list.flatMap((r) => (r.runs || []).map((x) => [r.member.name, r.member.role, dayKey(x.started), new Date(x.started).toLocaleTimeString(), x.title, x.category, x.status, x.passed, x.failed, x.seconds, x.failure].map(q).join(',')));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([['member,role,date,time,flow,category,result,tests_passed,tests_failed,seconds,failure', ...rows].join('\n')], { type: 'text/csv' }));
    a.download = `team-report-${dayKey(Date.now())}.csv`; a.click();
  };
}

/* ============================================================ timer */
function startTick() { stopTick(); tick = setInterval(() => { const dt = $('dTime'); if (dt && running && dashRun && dashRun.id === running.id) dt.textContent = dur(Math.round((Date.now() - running.started) / 1000)); const e = $('elapsed'); if (e && running && viewing === running) e.textContent = dur(Math.round((Date.now() - running.started) / 1000)); }, 1000); }
function stopTick() { clearInterval(tick); }
boot().then(() => { loadBugs(); syncQuick(); const h = location.hash.slice(1); setView(VIEWS[h] ? h : h === 'runner' ? 'run' : 'dashboard'); });
</script>
</body>
</html>
